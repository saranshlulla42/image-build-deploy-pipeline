name: Build, test, scan and release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Application, image and Kubernetes tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Unit and fault-path tests
        run: python -m pytest --junitxml=artifacts/unit-tests.xml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build candidate once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: demo-app:${{ github.sha }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify restricted container and embedded identity
        run: python scripts/container_smoke.py --image "demo-app:$GITHUB_SHA" --expected-version "$GITHUB_SHA"
      - name: Scan candidate and retain all vulnerability findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: demo-app:${{ github.sha }}
          scan-type: image
          scanners: vuln
          format: json
          output: artifacts/trivy-full.json
          exit-code: '0'
          ignore-unfixed: false
          timeout: 10m
      - name: Block fixable HIGH and CRITICAL findings
        run: |
          python scripts/security_gate.py --report artifacts/trivy-full.json \
            --expected-image "demo-app:$GITHUB_SHA" \
            --expected-image-id "$(docker image inspect "demo-app:$GITHUB_SHA" --format '{{.Id}}')"
      - name: Create disposable integration cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          cluster_name: ci-cluster
          config: k8s/kind.yaml
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kubectl_version: v1.37.1
          wait: 120s
      - name: Test rolling update, bad readiness, wrong version and first-release failure
        run: |
          python scripts/integration_demo.py --context kind-ci-cluster \
            --image "demo-app:$GITHUB_SHA" --version "$GITHUB_SHA"
      - name: Export exact tested candidate for publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save "demo-app:$GITHUB_SHA" | gzip > candidate.tar.gz
      - name: Retain candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-candidate
          path: candidate.tar.gz
          retention-days: 2
          compression-level: 0
      - name: Retain test and scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-evidence
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

  publish:
    name: Publish the tested image
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-candidate
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish without rebuilding and resolve registry digest
        id: publish
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          gzip -dc candidate.tar.gz | docker load
          image="ghcr.io/${REPOSITORY,,}"
          tag="$image:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag "demo-app:$GITHUB_SHA" "$tag"
          docker push "$tag"
          image_ref=$(docker image inspect "$tag" --format '{{json .RepoDigests}}' \
            | python -c 'import json,sys; prefix=sys.argv[1]+"@sha256:"; print(next(x for x in json.load(sys.stdin) if x.startswith(prefix)))' "$image")
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "### Published tested release" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $image_ref" >> "$GITHUB_STEP_SUMMARY"

  deploy-persistent:
    name: Deploy to persistent Kubernetes
    needs: publish
    if: vars.PERSISTENT_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Install pinned Kubernetes tools without creating a cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
          version: v0.33.0
          kubectl_version: v1.37.1
      - name: Skip superseded source commits
        id: fresh
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Superseded release: persistent deployment skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configure namespace-scoped cluster credentials
        if: steps.fresh.outputs.current == 'true'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ["KUBECONFIG_B64"]
          if not encoded:
              raise SystemExit("Configure the demo environment KUBECONFIG_B64 secret first")
          path = Path(os.environ["RUNNER_TEMP"]) / "pipeline.kubeconfig"
          path.touch(mode=0o600)
          path.write_bytes(base64.b64decode(encoded, validate=True))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("KUBECONFIG=" + str(path) + "\n")
          PY
      - name: Require anonymously pullable image for persistent nodes
        if: steps.fresh.outputs.current == 'true'
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          docker --config "$RUNNER_TEMP/anonymous-docker" manifest inspect "$IMAGE_REF" >/dev/null
      - name: Deploy and verify; restore previous release on failure
        if: steps.fresh.outputs.current == 'true'
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
          KUBE_CONTEXT: ${{ vars.KUBE_CONTEXT }}
        run: |
          test -n "$KUBE_CONTEXT"
          python scripts/release.py --context "$KUBE_CONTEXT" --namespace image-pipeline \
            --image "$IMAGE_REF" --expected-version "$GITHUB_SHA" --report artifacts/persistent-release.json
      - name: Retain persistent release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persistent-release-evidence
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove temporary kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/pipeline.kubeconfig"

  deployment-status:
    name: Report unconfigured cloud deployment
    needs: publish
    if: vars.PERSISTENT_DEPLOY_ENABLED != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### Persistent cloud deployment is not configured" >> "$GITHUB_STEP_SUMMARY"
          echo "The image passed local integration tests and was published. No persistent cloud application was deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "Follow docs/CLOUD_SETUP.md to configure a target before enabling PERSISTENT_DEPLOY_ENABLED." >> "$GITHUB_STEP_SUMMARY"
